<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Yellow background -->
  <rect width="100" height="100" fill="#FFE600" rx="16"/>
  <!-- Black border (brutalist style) -->
  <rect x="3" y="3" width="94" height="94" fill="none" stroke="#000000" stroke-width="5" rx="13"/>
  <!-- Bold letter Q -->
  <text
    x="50"
    y="72"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="72"
    fill="#000000"
    text-anchor="middle"
    dominant-baseline="auto"
  >Q</text>
</svg>
