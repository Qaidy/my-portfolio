<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark Charcoal Background -->
  <rect width="100" height="100" fill="#121110" rx="22"/>
  
  <!-- Subtle Minimal Border -->
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#2c2a27" stroke-width="2" rx="20"/>

  <!-- Geometric Modular 'q' matching OpenCode aesthetic -->
  <g fill="#EDEDEC">
    <!-- Main Bowl -->
    <rect x="27" y="22" width="46" height="40" rx="8"/>
    <!-- Descender Stem -->
    <rect x="62" y="34" width="11" height="44" rx="4"/>
  </g>
  
  <!-- Inner Counter Cutout -->
  <rect x="38" y="32" width="24" height="20" rx="4" fill="#121110"/>
</svg>
